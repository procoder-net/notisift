name: 🐛 Bug
description: Something broke or behaves unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What you did, what you expected, what you saw. No real notification content, please." }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: "Phone, Android version, launcher", placeholder: "Galaxy Z Fold, Android 16, One UI 8" }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: NotiSift version, placeholder: "0.1.0" }
  - type: textarea
    id: logs
    attributes: { label: Screenshots or logs, description: "Demo build screenshots or redacted ones only." }
